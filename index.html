    // ── PubMed API ───────────────────────────────────────────────
    async function fetchPubMed(keyword, max = 6) {
      const enc = encodeURIComponent(keyword);
      const to = new Date(), from = new Date();
      from.setDate(to.getDate() - 120);
      const f = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
      const range = `${f(from)}:${f(to)}[PDAT]`;
      const ids = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${enc}+${encodeURIComponent(range)}&retmax=${max}&sort=pub+date&retmode=json`)
        .then(r => r.json()).then(d => d.esearchresult?.idlist || []);
      if (!ids.length) return [];
      const result = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${ids.join(",")}&retmode=json`)
        .then(r => r.json()).then(d => d.result);
      return ids.map(id => {
        const doc = result[id] || {};
        const au = (doc.authors||[]).slice(0,2).map(a=>a.name).join(", ");
        return { id, title: doc.title||"", journal: doc.fulljournalname||doc.source||"", pubdate: doc.pubdate||"", authors: au + ((doc.authors||[]).length>2?" et al.":""), url:`https://pubmed.ncbi.nlm.nih.gov/${id}/`, titleKo:null, summary:null, loadingAI:false };
      });
    }

    // ── Gemini 모델 목록 ─────────────────────────────────────────
    const GEMINI_MODELS = [
      { id: "gemini-2.5-flash", name: "Gemini 2.5 Flash (최신, 추천)" },
      { id: "gemini-2.0-flash", name: "Gemini 2.0 Flash" },
      { id: "gemini-2.0-flash-lite", name: "Gemini 2.0 Flash Lite (경량)" },
      { id: "gemini-1.5-flash", name: "Gemini 1.5 Flash (안정)" },
    ];

    // ── Gemini API ───────────────────────────────────────────────
    async function callGemini(title, journal, apiKey, model) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `의학논문 제목을 한국어로 번역하고, 임상 의사 관점에서 핵심을 2문장으로 요약해주세요.\n\n제목: "${title}"\n저널: ${journal}\n\nJSON만 반환: {"titleKo":"한국어 제목","summary":"임상 핵심 요약"}` }] }],
          generationConfig: { temperature: 0.3, maxOutputTokens: 1000 }
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
      try { return JSON.parse(text.replace(/```json|```/g,"").trim()); }
      catch { return { titleKo: title, summary: text }; }
    }

    async function getAISummary(title, journal, apiKey, selectedModel) {
      if (!apiKey) {
        return { titleKo: "API 키 필요", summary: "설정 탭에서 Gemini API 키를 입력해주세요. Google AI Studio(aistudio.google.com)에서 무료로 발급받을 수 있습니다." };
      }
      // 선택된 모델 우선 시도, 실패 시 다른 모델로 폴백
      const models = [selectedModel, ...GEMINI_MODELS.map(m => m.id).filter(m => m !== selectedModel)];
      for (const model of models) {
        try {
          const result = await callGemini(title, journal, apiKey, model);
          return result;
        } catch (err) {
          console.warn(`${model} 실패:`, err.message);
          if (model === models[models.length - 1]) {
            return { titleKo: "API 오류", summary: `모든 모델에서 오류 발생. 마지막 오류: ${err.message}` };
          }
          // 다음 모델로 폴백
        }
      }
    }

    // ── 날짜 ────────────────────────────────────────────────────
    function ago(s) {
      if (!s) return "";
      const d = new Date(s); if (isNaN(d)) return s;
      const n = Math.floor((Date.now()-d)/86400000);
      if (n<=0) return "오늘"; if (n<7) return `${n}일 전`;
      if (n<30) return `${Math.floor(n/7)}주 전`; return `${Math.floor(n/30)}개월 전`;
    }

      const [apiKeyInput, setApiKeyInput] = useState(() => localStorage.getItem("medifed_gemini_key") || "");
      const [keySaved, setKeySaved] = useState(false);
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem("medifed_gemini_model") || "gemini-2.5-flash");

      const saveApiKey = () => {
        const k = apiKeyInput.trim();
        setApiKey(k);
        localStorage.setItem("medifed_gemini_key", k);
        localStorage.setItem("medifed_gemini_model", selectedModel);
        setKeySaved(true);
        setTimeout(() => setKeySaved(false), 2000);
      };
      const clearApiKey = () => {
        setApiKey(""); setApiKeyInput("");
        localStorage.removeItem("medifed_gemini_key");
      };

      const load = useCallback(async () => {
        if (!keywords.length) return;
        setLoading(true);
        try {
          const res = await Promise.all(keywords.map(async kw => ({ kw, items: await fetchPubMed(kw) })));
          setPapers(res); setUpdatedAt(new Date());
        } finally { setLoading(false); }
      }, [keywords]);

      useEffect(() => { load(); }, [load]);

      const addKw = (kw) => {
        const t = kw.trim().toLowerCase();
        if (!t || keywords.includes(t)) return;
        setKeywords(p => [...p, t]); setInput("");
      };
      const removeKw = kw => { setKeywords(p => p.filter(k=>k!==kw)); setPapers(p=>p.filter(g=>g.kw!==kw)); };
      const toggleSave = (paper, kw) => setSaved(p => p.find(s=>s.id===paper.id) ? p.filter(s=>s.id!==paper.id) : [...p,{...paper,kw}]);
      const isSaved = id => saved.some(s=>s.id===id);

      const handleAI = async (paperId, kw) => {
        const update = fn => setPapers(prev => prev.map(g => ({ ...g, items: g.items.map(i => i.id===paperId ? fn(i) : i) })));
        update(i => ({ ...i, loadingAI: true }));
        const paper = papers.find(g=>g.kw===kw)?.items.find(i=>i.id===paperId);
        if (!paper) return;
        const result = await getAISummary(paper.title, paper.journal, apiKey, selectedModel);
        update(i => ({ ...i, ...result, loadingAI: false }));
        setExpandedId(paperId);
      };

      const allPapers = papers.flatMap(g => g.items.map(i => ({...i, kw: g.kw})));

            .key-save { background: var(--ink); color: var(--bg); border: none; border-radius: 8px; padding: 10px 18px; font-family: 'Instrument Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
            .key-save:hover { opacity: .75; }
            .key-status { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 14px; border-radius: 8px; }
            .key-status.ok { background: var(--green-bg); color: var(--green); }
            .key-status.empty { background: var(--amber-bg); color: var(--amber); }
            .key-status .key-clear { background: none; border: none; color: var(--ink3); cursor: pointer; font-size: 12px; margin-left: auto; text-decoration: underline; }
            .key-status .key-clear:hover { color: #DC2626; }
            .key-saved-toast { font-size: 12px; color: var(--green); font-weight: 600; animation: fade .25s ease; }
            .model-row { margin-bottom: 14px; }
            .model-label { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
            .model-select { width: 100%; background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: 'Instrument Sans', sans-serif; font-size: 14px; color: var(--ink); outline: none; cursor: pointer; transition: border-color .15s; appearance: auto; }
            .model-select:focus { border-color: var(--ink2); }
            .how-to { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
            .how-to h3 { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
            .how-to ol { padding-left: 20px; }
            .how-to li { font-size: 13px; color: var(--ink2); line-height: 1.8; }
            .how-to code { background: var(--line2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }

            @media (max-width: 600px) {
              .hd { flex-direction: column; align-items: flex-start; padding: 32px 0 24px; }
              .stats { gap: 20px; }
            }
          `}</style>

          <div className="wrap">
            {/* 헤더 */}
            <header className="hd">
              <div className="hd-left">
                <h1>MediFed</h1>
                <p>PubMed 최신 의학논문 · AI 번역 · 임상 요약</p>
              </div>
              <div className="hd-right">
                {updatedAt && <span className="ts">{updatedAt.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 업데이트</span>}
                <button className="refresh" onClick={load} disabled={loading}>
                  {loading ? <><div className="spin" style={{borderColor:"rgba(250,250,248,.25)",borderTopColor:"var(--bg)"}} />불러오는 중</> : "새로고침"}
                </button>
              </div>
            </header>

            {/* 탭 */}
            <div className="tabs">
              <button className={`tab ${tab==="feed"?"on":""}`} onClick={()=>setTab("feed")}>논문 피드 {allPapers.length>0&&`(${allPapers.length})`}</button>
              <button className={`tab ${tab==="kw"?"on":""}`} onClick={()=>setTab("kw")}>키워드 ({keywords.length})</button>
              <button className={`tab ${tab==="saved"?"on":""}`} onClick={()=>setTab("saved")}>저장됨 ({saved.length})</button>
              <button className={`tab ${tab==="settings"?"on":""}`} onClick={()=>setTab("settings")}>설정 {!apiKey&&"⚠️"}</button>
            </div>

            {/* ══ 피드 ══ */}
            {tab==="feed" && <>
              {allPapers.length>0 && (
                <div className="stats">
                  <div><span className="stat-n">{allPapers.length}</span><span className="stat-l">논문</span></div>
                  <div><span className="stat-n">{keywords.length}</span><span className="stat-l">키워드</span></div>
                  <div><span className="stat-n">{allPapers.filter(p=>p.titleKo).length}</span><span className="stat-l">번역 완료</span></div>
                  <div><span className="stat-n">{saved.length}</span><span className="stat-l">저장됨</span></div>
                </div>
              )}

              <div className="search-wrap">
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="제목 또는 키워드로 검색" />
                {q && <button className="search-clear" onClick={()=>setQ("")}>×</button>}
              </div>

              {loading && !allPapers.length ? (
                <div className="loading-wrap"><div className="loading-bar" /><div className="loading-t">PubMed에서 논문 불러오는 중…</div></div>
              ) : !keywords.length ? (
                <div className="empty"><div className="empty-icon">○</div><div className="empty-t">키워드를 추가해주세요</div><div className="empty-s">키워드 탭에서 관심 질환을 추가하면<br/>최신 논문을 불러옵니다.</div></div>
              ) : q ? (
                filtered.length===0
                  ? <div className="empty"><div className="empty-icon">○</div><div className="empty-t">검색 결과 없음</div></div>
                  : filtered.map(p=><Card key={p.id} p={p} kw={p.kw} saved={isSaved(p.id)} onSave={()=>toggleSave(p,p.kw)} onAI={()=>handleAI(p.id,p.kw)} expanded={expandedId===p.id} onExpand={()=>setExpandedId(expandedId===p.id?null:p.id)} />)
              ) : (
                papers.map(g => g.items.length>0 && (
                  <div key={g.kw} className="section">
                    <div className="sec-hd"><span className="sec-kw">{g.kw}</span><span className="sec-cnt">{g.items.length}편</span></div>
                    {g.items.map(p=><Card key={p.id} p={p} kw={g.kw} saved={isSaved(p.id)} onSave={()=>toggleSave(p,g.kw)} onAI={()=>handleAI(p.id,g.kw)} expanded={expandedId===p.id} onExpand={()=>setExpandedId(expandedId===p.id?null:p.id)} />)}
                  </div>
                ))
              )}
            </>}

            {/* ══ 키워드 ══ */}
            {tab==="kw" && <>
              <div className="kw-section">
                <div className="sec-label">키워드 추가</div>
                <div className="kw-row">
                  <input className="kw-input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addKw(input)} placeholder="예: tonsillitis, GERD, vertigo…" />
                  <button className="kw-add" onClick={()=>addKw(input)}>+</button>
                </div>
                <div className="kw-tags">
                  {keywords.length===0
                    ? <span style={{fontSize:13,color:"var(--ink3)"}}>키워드 없음</span>
                    : keywords.map(kw=><span key={kw} className="kw-tag">{kw}<button className="kw-x" onClick={()=>removeKw(kw)}>×</button></span>)
                  }
                </div>
              </div>

              <div className="kw-section">
                <div className="sec-label">진료과별 추천</div>
                <div className="dept-row">
                  {Object.keys(DEPT_PRESETS).map(d=><button key={d} className={`dept-btn ${activeDept===d?"on":""}`} onClick={()=>setActiveDept(d)}>{d}</button>)}
                </div>
                <div className="preset-list">
                  {(DEPT_PRESETS[activeDept]||[]).map(v=>{
                    const on=keywords.includes(v);
                    return <button key={v} className={`preset ${on?"on":""}`} onClick={()=>!on&&addKw(v)}>{on?"✓ ":""}{v}</button>;
                  })}
                </div>
              </div>

              <button className="load-btn" onClick={()=>{setTab("feed");load();}}>논문 불러오기</button>
            </>}

            {/* ══ 저장됨 ══ */}
            {tab==="saved" && (
              saved.length===0
                ? <div className="empty"><div className="empty-icon">○</div><div className="empty-t">저장된 논문 없음</div><div className="empty-s">논문 카드에서 저장 버튼을 눌러보세요.</div></div>
                : saved.map(p=><Card key={p.id} p={p} kw={p.kw} saved={true} onSave={()=>toggleSave(p,p.kw)} onAI={()=>{}} expanded={expandedId===p.id} onExpand={()=>setExpandedId(expandedId===p.id?null:p.id)} />)
            )}

            {/* ══ 설정 ══ */}
            {tab==="settings" && <>
              <div className="setting-section">
                <div className="sec-label">AI 번역 · 요약 API 설정</div>
                <div className="setting-desc">
                  논문 제목 한국어 번역과 임상 요약 기능을 사용하려면 <strong>Google Gemini API 키</strong>가 필요합니다.<br/>
                  <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">👉 Google AI Studio에서 무료 API 키 발급받기</a>
                </div>

                <div className="key-row">
                  <input className="key-input" type="password" value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()} placeholder="Gemini API 키를 입력하세요" />
                  <button className="key-save" onClick={saveApiKey}>저장</button>
                </div>

                {keySaved && <div className="key-saved-toast">✓ API 키가 저장되었습니다</div>}

                <div className={`key-status ${apiKey ? "ok" : "empty"}`}>
                  {apiKey
                    ? <><span>✓ API 키 등록됨 ({apiKey.slice(0,6)}…{apiKey.slice(-4)})</span><button className="key-clear" onClick={clearApiKey}>삭제</button></>
                    : <span>⚠ API 키가 설정되지 않았습니다</span>
                  }
                </div>
              </div>

              <div className="setting-section">
                <div className="sec-label">AI 모델 선택</div>
                <div className="setting-desc">할당량 초과 시 자동으로 다른 모델로 전환됩니다.</div>
                <div className="model-row">
                  <select className="model-select" value={selectedModel} onChange={e=>{setSelectedModel(e.target.value);localStorage.setItem("medifed_gemini_model",e.target.value);}}>
                    {GEMINI_MODELS.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                  </select>
                </div>
              </div>

              <div className="setting-section">
                <div className="how-to">
                  <h3>🔑 API 키 발급 방법</h3>
                  <ol>
                    <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>에 접속합니다.</li>
                    <li>Google 계정으로 로그인합니다.</li>
                    <li><strong>"Create API Key"</strong> 버튼을 클릭합니다.</li>
                    <li>생성된 API 키를 복사하여 위 입력란에 붙여넣기합니다.</li>
                  </ol>
                </div>
              </div>

              <div className="setting-section">
                <div className="how-to">
                  <h3>ℹ️ 참고 사항</h3>
                  <ol>
                    <li>Gemini API 무료 티어: 분당 15회, 하루 100만 토큰까지 무료</li>
                    <li>API 키는 이 브라우저의 <code>localStorage</code>에만 저장됩니다.</li>
                    <li>서버로 전송되지 않으며, 다른 사람과 공유되지 않습니다.</li>
                  </ol>
                </div>
              </div>
            </>}
          </div>
        </>
      );
    }

    // ── 카드 컴포넌트 ─────────────────────────────────────────────
    function Card({ p, kw, saved, onSave, onAI, expanded, onExpand }) {
      const hasAI = p.titleKo || p.summary;
      return (
        <div className="card">
          <div className="card-meta">
            {p.journal && <span className="card-journal">{p.journal}</span>}
            {p.journal && p.pubdate && <span className="dot" />}
            {p.pubdate && <span className="card-date">{ago(p.pubdate)}</span>}
            <span className="card-kw">{kw}</span>
          </div>

          <div className="card-title">{p.title}</div>

          {p.titleKo && expanded && <div className="card-title-ko">{p.titleKo}</div>}
          {p.authors && <div className="card-authors">{p.authors}</div>}
          {p.summary && expanded && (
            <div className="card-summary">
              <div className="card-summary-label">AI 임상 요약</div>
              {p.summary}
            </div>
          )}

          <div className="card-foot">
            <a className="btn btn-pub" href={p.url} target="_blank" rel="noopener noreferrer">PubMed</a>

            <button className="btn btn-ai" onClick={hasAI ? onExpand : onAI} disabled={p.loadingAI}>
              {p.loadingAI
                ? <><div className="spin" />번역 중</>
                : hasAI
                  ? expanded ? "접기" : "번역 · 요약 보기"
                  : "AI 번역 · 요약"}
            </button>

            <button className={`btn btn-save ${saved?"on":""}`} onClick={onSave}>
              {saved ? "저장됨" : "저장"}
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
